<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerador Estratégico Lotofácil</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f4f6f9;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      max-width: 650px;
      width: 100%;
      background: #ffffff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    h2 {
      color: #930089;
      margin-top: 0;
      text-align: center;
    }

    p {
      color: #555;
      font-size: 14px;
      line-height: 1.4;
    }

    textarea {
      width: 100%;
      height: 150px;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      resize: vertical;
      font-family: monospace;
      font-size: 13px;
    }

    button {
      width: 100%;
      background-color: #930089;
      color: white;
      border: none;
      padding: 12px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 15px;
      transition: background 0.2s;
    }

    button:hover {
      background-color: #72006a;
    }

    .result-box {
      margin-top: 25px;
      padding: 15px;
      background-color: #f8e8f7;
      border-left: 5px solid #930089;
      border-radius: 4px;
      display: none;
    }

    .balls-container {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .ball {
      width: 38px;
      height: 38px;
      background-color: #930089;
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 15px;
    }

    .stats {
      margin-top: 15px;
      font-size: 13px;
      color: #333;
    }

    .stats ul {
      margin: 5px 0 0 0;
      padding-left: 20px;
    }

    .error-msg {
      color: #d9534f;
      font-weight: bold;
      margin-top: 10px;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>Gerador Lotofácil Estratégico</h2>
  <p>Insira abaixo os <strong>15 últimos concursos</strong> (15 números por linha, separados por espaço ou vírgula):</p>
  
  <textarea id="historico" placeholder="01 02 03 04 05 06 07 08 09 10 11 12 13 14 15&#10;... (cole 15 jogos aqui)"></textarea>

  <button onclick="gerarJogoEstrategico()">Gerar Jogo</button>

  <div id="erro" class="error-msg"></div>

  <div id="resultado" class="result-box">
    <strong>Jogo Gerado:</strong>
    <div id="bolas" class="balls-container"></div>
    
    <div class="stats">
      <strong>Resumo do Jogo:</strong>
      <ul id="detalhes"></ul>
    </div>
  </div>
</div>

<script>
  function embaralhar(array) {
    return array.sort(() => Math.random() - 0.5);
  }

  function gerarJogoEstrategico() {
    const texto = document.getElementById('historico').value.trim();
    const erroDiv = document.getElementById('erro');
    const resultadoDiv = document.getElementById('resultado');
    
    erroDiv.innerText = '';
    resultadoDiv.style.display = 'none';

    // Processa o texto em linhas e números
    const linhas = texto.split('\n').filter(l => l.trim() !== '');
    
    if (linhas.length < 15) {
      erroDiv.innerText = `Por favor, insira exatamente 15 concursos (você inseriu ${linhas.length}).`;
      return;
    }

    const jogos = linhas.slice(0, 15).map(linha => {
      const nums = linha.match(/\d+/g);
      return nums ? nums.map(Number) : [];
    });

    for (let i = 0; i < jogos.length; i++) {
      if (jogos[i].length !== 15) {
        erroDiv.innerText = `O concurso ${i + 1} contém ${jogos[i].length} números. Cada linha deve ter 15 dezenas.`;
        return;
      }
    }

    // Contagem de frequência de todos os 25 números
    const frequencias = {};
    for (let i = 1; i <= 25; i++) frequencias[i] = 0;
    
    jogos.forEach(jogo => {
      jogo.forEach(num => {
        if (num >= 1 && num <= 25) frequencias[num]++;
      });
    });

    const ultimoConcurso = jogos[0]; // A primeira linha inserida é considerada o último jogo
    const universoTotal = Array.from({length: 25}, (_, i) => i + 1);

    // Tentativas de geração até atender todos os critérios simultaneamente
    let apostaFinal = null;
    let metaRepetidosUltimo = 0;
    let metaMaisFrequentes = 0;
    let maxTentativas = 5000;

    while (maxTentativas > 0 && !apostaFinal) {
      maxTentativas--;

      // Sorteia metas das restrições (7 a 10 números do último concurso)
      metaRepetidosUltimo = Math.floor(Math.random() * 3) + 7; // 7, 8, 9, 10
      metaMaisFrequentes = Math.max(0, 6 - metaRepetidosUltimo);

      // Separação de Números
      const repetidosDisponiveis = [...ultimoConcurso];

      // Ordena por frequência no histórico
      const ordenadosPorFreqDesc = [...universoTotal].sort((a, b) => frequencias[b] - frequencias[a]);
      const ordenadosPorFreqAsc = [...universoTotal].sort((a, b) => frequencias[a] - frequencias[b]);

      // 1. Seleciona 2 menos repetidas no histórico geral
      const menosFrequentes = ordenadosPorFreqAsc.slice(0, 8);
      const grupoMenosFreq = embaralhar(menosFrequentes).slice(0, 2);

      // 2. Seleciona N do último concurso (entre 7 e 11)
      const grupoUltimoConcurso = embaralhar(repetidosDisponiveis).slice(0, metaRepetidosUltimo);

      // 3. Seleciona N mais repetidas no histórico geral
      const maisFrequentes = ordenadosPorFreqDesc.slice(0, 10);
      const candidatosMaisFreq = maisFrequentes.filter(n => 
        !grupoMenosFreq.includes(n) && !grupoUltimoConcurso.includes(n)
      );
      
      const grupoMaisFreq = embaralhar(candidatosMaisFreq).slice(0, metaMaisFrequentes);

      // Une a base inicial
      let candidatosBase = Array.from(new Set([...grupoMenosFreq, ...grupoUltimoConcurso, ...grupoMaisFreq]));

      // Preenche o restante com números ainda não utilizados
      let restantes = universoTotal.filter(n => !candidatosBase.includes(n));
      restantes = embaralhar(restantes);

      let aposta = [...candidatosBase];
      while (aposta.length < 15 && restantes.length > 0) {
        aposta.push(restantes.pop());
      }

      if (aposta.length !== 15) continue;

      // Validação das regras de Ímpares e Pares (7P/8I ou 8P/7I)
      const impares = aposta.filter(n => n % 2 !== 0).length;
      const pares = aposta.filter(n => n % 2 === 0).length;
      const paridadeValida = (pares === 7 && impares === 8) || (pares === 8 && impares === 7);

      // Validação da regra do último concurso (7 a 11 repetições)
      const repetidosReais = aposta.filter(n => ultimoConcurso.includes(n)).length;
      const repetiçãoValida = (repetidosReais >= 7 && repetidosReais <= 11);

      if (paridadeValida && repetiçãoValida) {
        apostaFinal = aposta.sort((a, b) => a - b);
      }
    }

    if (!apostaFinal) {
      erroDiv.innerText = "Não foi possível combinar todas as regras com esse histórico. Tente gerar novamente.";
      return;
    }

    // Exibição dos resultados
    const bolasDiv = document.getElementById('bolas');
    bolasDiv.innerHTML = '';
    apostaFinal.forEach(num => {
      const numFormatado = num < 10 ? '0' + num : num;
      bolasDiv.innerHTML += `<div class="ball">${numFormatado}</div>`;
    });

    const numImpares = apostaFinal.filter(n => n % 2 !== 0).length;
    const numPares = apostaFinal.filter(n => n % 2 === 0).length;
    const numRepetidosUltimo = apostaFinal.filter(n => ultimoConcurso.includes(n)).length;

    document.getElementById('detalhes').innerHTML = `
      <li><strong>Pares / Ímpares:</strong> ${numPares} Pares e ${numImpares} Ímpares.</li>
      <li><strong>Repetições do Último Concurso:</strong> ${numRepetidosUltimo} números.</li>
      <li><strong>Dezenas Selecionadas:</strong> ${apostaFinal.map(n => n < 10 ? '0' + n : n).join(', ')}</li>
    `;

    resultadoDiv.style.display = 'block';
  }
</script>

</body>
</html>
